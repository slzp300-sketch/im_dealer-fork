name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # pnpm 을 먼저 PATH 에 올려야 setup-node 의 cache:pnpm 이 store 경로를 계산할 수 있다.
      # version 미지정 → package.json 의 packageManager(pnpm@11.0.8) 를 사용.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # prisma validate 는 DB 에 접속하지 않고 스키마 문법만 검사한다. fork PR 에는
      # secrets 가 전달되지 않아 빈 값이 되고 P1012 로 실패하므로(#62·#64 관측),
      # 접속에 쓰이지 않는 자리표시자 URL 로 고정해 secrets 의존을 없앤다.
      - name: Validate Prisma schema
        run: pnpm exec prisma validate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      # fork PR 은 secrets(DB·Supabase 키) 미전달로 프리렌더의 DB 조회가 반드시
      # 실패하므로 빌드를 건너뛴다. 같은 레포 브랜치 PR 과 main push 는 그대로 빌드.
      - name: Build
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: pnpm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # 운영 도메인. src/lib/site-config.ts 의 CANONICAL_SITE_URL 과 일치해야 한다
          # (NEXT_PUBLIC_ 값은 빌드 산출물에 그대로 박힌다).
          NEXT_PUBLIC_APP_URL: https://imdealer.co.kr
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: ci
    # fork PR 은 secrets 미전달로 빌드·구동이 불가능해 잡 자체를 건너뛴다.
    # 머지 후 main push 에서 전체 수트가 다시 돈다.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 브라우저 바이너리를 캐시해 다운로드 단계를 건너뛴다. lockfile 이 바뀌면
      # (= playwright 버전이 바뀌면) 새로 받는다.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        timeout-minutes: 15
        run: |
          # 브라우저 본체는 Playwright CDN 에서 받는다 — apt 와 무관하고, 캐시가 맞으면 즉시 끝난다.
          ./.github/scripts/retry.sh 300 pnpm exec playwright install chromium

          # 시스템 라이브러리만 apt 를 탄다. ubuntu-latest 러너에는 대부분 이미 들어 있어
          # 실패해도 진행한다. 정말 빠져 있으면 브라우저 실행 시점에 명확한 에러로 드러난다.
          # 재시도하지 않는 이유: 중단된 apt 가 락을 쥔 채 남아 이어지는 시도가 전부
          # lock 오류로 즉사한다(2026-08-19 관측).
          if ! timeout --kill-after=10s 240 pnpm exec playwright install-deps chromium; then
            echo "::warning::playwright install-deps 실패 — 러너 기본 라이브러리로 진행합니다"
            ./.github/scripts/apt-unlock.sh
          fi

      - name: Build app
        run: pnpm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      - name: Start app & run Playwright
        run: |
          pnpm start &
          # 서버 부팅 대기 (최대 60초)
          for i in {1..60}; do
            if curl -fs http://localhost:3000 > /dev/null 2>&1; then
              echo "Server ready after ${i}s"; break
            fi
            sleep 1
          done
          pnpm exec playwright test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          ADMIN_ACCESS_TOKEN: ${{ secrets.ADMIN_ACCESS_TOKEN }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_BASE_URL: http://localhost:3000
          # instrumentation.ts 의 loadEnv() 가 production(next start) 부팅 시 강제 검증하는 필수 키.
          # CI E2E 전용 더미 값 — 비밀 아님(실제 운영 값은 Vercel 환경변수에 별도 보관).
          IP_HASH_SALT: ci-e2e-ip-hash-salt-0123456789abcdef
          PII_ENCRYPTION_KEY: aW0tZGVhbGVyLWNpLWUyZS10ZXN0LWtleS0wMDAwMDA=
          CRON_SECRET: ci-e2e-cron-secret-0123456789abcdef0123456789
          # 격리된 CI 런타임은 Upstash 없이 구동한다(rate limit 비활성). Vercel 배포에서는
          # env.ts 가 이 플래그를 무시하므로 운영 가드는 그대로 유지된다.
          E2E_ALLOW_MISSING_RATE_LIMIT: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

  vehicle-image-e2e:
    name: Vehicle image E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: ci
    # fork PR 은 repo vars(PRODUCTION_* 지문) 전달이 보장되지 않아 가드 스텝에서
    # 실패하므로 잡을 건너뛴다. 머지 후 main push 에서 전체 수트가 다시 돈다.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop
            spec: e2e/admin-vehicle-images-desktop.spec.ts
          - name: mobile
            spec: e2e/admin-vehicle-images-mobile.spec.ts
          - name: failure
            spec: e2e/admin-vehicle-images-failure.spec.ts
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL client
        timeout-minutes: 12
        run: |
          # 러너 이미지에 이미 있으면 apt 를 아예 건드리지 않는다.
          if command -v psql > /dev/null 2>&1; then
            echo "psql 이미 설치돼 있습니다: $(psql --version)"
            exit 0
          fi
          # 미러가 멈춰도 30초면 포기하고 다른 미러로 넘어가게 한다.
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          export RETRY_CLEANUP=./.github/scripts/apt-unlock.sh
          ./.github/scripts/retry.sh 180 sudo apt-get $APT_OPTS update
          ./.github/scripts/retry.sh 180 sudo apt-get $APT_OPTS install --yes postgresql-client
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        timeout-minutes: 15
        run: |
          # 브라우저 본체는 Playwright CDN 에서 받는다 — apt 와 무관하고, 캐시가 맞으면 즉시 끝난다.
          ./.github/scripts/retry.sh 300 pnpm exec playwright install chromium

          # 시스템 라이브러리만 apt 를 탄다. ubuntu-latest 러너에는 대부분 이미 들어 있어
          # 실패해도 진행한다. 정말 빠져 있으면 브라우저 실행 시점에 명확한 에러로 드러난다.
          # 재시도하지 않는 이유: 중단된 apt 가 락을 쥔 채 남아 이어지는 시도가 전부
          # lock 오류로 즉사한다(2026-08-19 관측).
          if ! timeout --kill-after=10s 240 pnpm exec playwright install-deps chromium; then
            echo "::warning::playwright install-deps 실패 — 러너 기본 라이브러리로 진행합니다"
            ./.github/scripts/apt-unlock.sh
          fi
      - name: Require production deny fingerprint
        env:
          PRODUCTION_DATABASE_FINGERPRINT: ${{ vars.PRODUCTION_DATABASE_FINGERPRINT }}
          PRODUCTION_DATABASE_RUNTIME_FINGERPRINT: ${{ vars.PRODUCTION_DATABASE_RUNTIME_FINGERPRINT }}
          PRODUCTION_DATABASE_DIRECT_FINGERPRINT: ${{ vars.PRODUCTION_DATABASE_DIRECT_FINGERPRINT }}
        run: |
          test -n "$PRODUCTION_DATABASE_FINGERPRINT"
          test -n "$PRODUCTION_DATABASE_RUNTIME_FINGERPRINT"
          test -n "$PRODUCTION_DATABASE_DIRECT_FINGERPRINT"
      - name: Run isolated vehicle image scenario
        env:
          CARPAN2_E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          CARPAN2_E2E_DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          CARPAN2_E2E_EXPECTED_FINGERPRINT: 8f06e5e213436c9e7532f1aa5099328336c546ec07872b0631c07253a0f597e2
          PRODUCTION_DATABASE_FINGERPRINT: ${{ vars.PRODUCTION_DATABASE_FINGERPRINT }}
          PRODUCTION_DATABASE_RUNTIME_FINGERPRINT: ${{ vars.PRODUCTION_DATABASE_RUNTIME_FINGERPRINT }}
          PRODUCTION_DATABASE_DIRECT_FINGERPRINT: ${{ vars.PRODUCTION_DATABASE_DIRECT_FINGERPRINT }}
        run: pnpm exec tsx scripts/run-vehicle-image-e2e.ts --spec "${{ matrix.spec }}"
      - name: Upload vehicle image Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-image-playwright-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
            .omo/evidence/carpan2-admin-image-management/task-9-${{ matrix.name }}*
          retention-days: 14
